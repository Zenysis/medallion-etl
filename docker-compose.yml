services:
  postgres:
    image: postgres:15-alpine
    container_name: medallion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # docker-entrypoint-initdb.d runs these in lexical order on first start.
      # 00 creates demo_source + demo_gold; 01 + 02 populate demo_source.
      - ./setup/00_create_databases.sql:/docker-entrypoint-initdb.d/00_create_databases.sql:ro
      - ./setup/01_demo_source_schema.sql:/docker-entrypoint-initdb.d/01_demo_source_schema.sql:ro
      - ./setup/02_demo_source_seed.sql:/docker-entrypoint-initdb.d/02_demo_source_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: medallion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bronze + silver buckets once MinIO is up, then exits.
  minio-init:
    image: minio/mc
    container_name: medallion-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb -p local/bronze local/silver
      "
